name: Build unsigned iOS device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unsigned-ios-device-ipa

permissions:
  contents: read

jobs:
  ios-device-ipa:
    name: Build unsigned iPhone and iPad IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build unsigned iPhone and iPad app
        run: >-
          xcodebuild
          -workspace ios/MusicPlayerExpo.xcworkspace
          -scheme MusicPlayerExpo
          -configuration Release
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_APP="$RUNNER_TEMP/DeviceDerivedData/Build/Products/Release-iphoneos/MusicPlayerExpo.app"
          test -d "$DEVICE_APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          mkdir -p artifacts
          ditto "$DEVICE_APP" "$RUNNER_TEMP/ipa/Payload/MusicPlayerExpo.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/artifacts/MusicPlayerExpo-unsigned.ipa" Payload)
          unzip -l artifacts/MusicPlayerExpo-unsigned.ipa | head -20

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-ipa
          path: artifacts/MusicPlayerExpo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
